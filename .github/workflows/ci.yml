name: Push and PR Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: superheros
          POSTGRES_PASSWORD: superheros_pass
          POSTGRES_DB: superheros_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: superheros
          DB_PASSWORD: superheros_pass
          DB_DATABASE: superheros_db
          MONGO_URI: mongodb://localhost:27017/superheros_logs
          JWT_SECRET: test_jwt_secret_key_at_least_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_key_at_least_32_chars

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: superheros
          DB_PASSWORD: superheros_pass
          DB_DATABASE: superheros_db
          MONGO_URI: mongodb://localhost:27017/superheros_logs
          JWT_SECRET: test_jwt_secret_key_at_least_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_key_at_least_32_chars
          NODE_ENV: test
